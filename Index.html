<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Reservasi - Joy Salon</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    /* ========== Variabel warna (terang & gelap) ========== */
    :root {
      --bg: #f3eff0;
      --card: #ffffff;
      --input: #ffffff;
      --ink: #241a26;
      --muted: #7b6f7e;
      --line: #ece6ea;

      --plum: #3b1f3f;
      --plum-soft: #4d2b52;
      --plum-line: #5b3a60;
      --plum-active: #6a4670;
      --sidebar-text: #cdb9d2;

      --waiting: #a8741a;
      --confirmed: #8a6a1f;
      --confirmed-line: #c9a24a;
      --done: #2f7a5f;
      --rejected: #c2456b;

      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #1a141c;
        --card: #251c28;
        --input: #2b2130;
        --ink: #f1e8f3;
        --muted: #a597a8;
        --line: #3a2d3e;
      }
    }

    :root[data-theme="dark"] {
      --bg: #1a141c;
      --card: #251c28;
      --input: #2b2130;
      --ink: #f1e8f3;
      --muted: #a597a8;
      --line: #3a2d3e;
    }

    /* ========== Dasar ========== */
    html {
      scroll-padding-top: env(safe-area-inset-top, 0px);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font: 14px/1.4 Inter, system-ui, sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
      color: inherit;
    }

    :focus-visible {
      outline: 2px solid #9b6fa3;
      outline-offset: 2px;
    }

    /* ========== Tata letak utama ========== */
    .app {
      display: grid;
      grid-template-columns: 230px 1fr;
      min-height: 100vh;
    }

    main {
      min-width: 0;
      padding: 22px 24px;
    }

    /* ========== Sidebar ========== */
    .sidebar {
      padding: 22px 16px;
      background: var(--plum);
      color: #e9dcec;
    }

    .sidebar h1 {
      margin: 0;
      font-size: 16px;
    }

    .sidebar small {
      color: #b9a2be;
      font-size: 11px;
    }

    .menu {
      display: grid;
      gap: 8px;
      margin-top: 22px;
    }

    .menu a {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border: 1px solid var(--plum-line);
      border-radius: 8px;
      background: var(--plum-soft);
      color: var(--sidebar-text);
      font-size: 12.5px;
      text-decoration: none;
    }

    .menu a.active {
      border-color: #8a6491;
      background: var(--plum-active);
      color: #ffffff;
    }

    .menu svg {
      flex: none;
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ========== Header halaman ========== */
    .page-head {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .page-head h2 {
      margin: 0;
      font-size: 19px;
    }

    .page-head p {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    /* ========== Tombol & input ========== */
    .btn {
      padding: 10px 16px;
      border: 0;
      border-radius: 8px;
      background: var(--plum);
      color: #ffffff;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-ghost {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
    }

    .btn-danger {
      background: var(--rejected);
    }

    input,
    select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--input);
    }

    /* ========== Pencarian & filter ========== */
    .filters {
      display: grid;
      grid-template-columns: 1fr 150px 160px;
      gap: 12px;
      margin: 16px 0;
    }

    /* ========== Tabel ========== */
    .card {
      padding: 6px 18px 14px;
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--card);
    }

    table {
      width: 100%;
      min-width: 640px;
      border-collapse: collapse;
    }

    th {
      padding: 14px 8px 10px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 11.5px;
      font-weight: 500;
      text-align: left;
    }

    td {
      padding: 13px 8px;
      border-bottom: 1px solid var(--line);
      font-size: 13px;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .empty {
      padding: 36px 0;
      color: var(--muted);
      text-align: center;
    }

    /* Badge status */
    .pill {
      display: inline-block;
      padding: 2px 12px;
      border: 1px solid;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 500;
    }

    .status-Menunggu    { color: var(--waiting);   border-color: var(--waiting); }
    .status-Dikonfirmasi { color: var(--confirmed); border-color: var(--confirmed-line); }
    .status-Selesai     { color: var(--done);      border-color: var(--done); }
    .status-Ditolak     { color: var(--rejected);  border-color: var(--rejected); }

    /* Tombol aksi di tabel */
    .actions button {
      padding: 0;
      border: 0;
      background: none;
      color: var(--muted);
      font-size: 13px;
      cursor: pointer;
    }

    .actions button:hover {
      color: var(--plum);
      text-decoration: underline;
    }

    .actions .sep {
      margin: 0 5px;
      color: var(--muted);
    }

    /* ========== Dialog form ========== */
    dialog {
      width: min(440px, 92vw);
      padding: 22px;
      border: 0;
      border-radius: 14px;
      background: var(--card);
      color: var(--ink);
    }

    dialog::backdrop {
      background: rgba(20, 10, 24, .5);
    }

    dialog h3 {
      margin: 0 0 14px;
    }

    label {
      display: block;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 12px;
    }

    label input,
    label select {
      margin-top: 4px;
      color: var(--ink);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .dialog-foot {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 14px;
    }

    .dialog-foot .btn-danger {
      margin-right: auto;
    }

    /* ========== Notifikasi ========== */
    .toast {
      position: fixed;
      bottom: calc(18px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 18px;
      border-radius: 99px;
      background: var(--plum);
      color: #ffffff;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
    }

    .toast.show {
      opacity: 1;
    }

    /* ========== Responsif ========== */
    @media (max-width: 820px) {
      .app {
        grid-template-columns: 1fr;
      }

      .sidebar {
        padding: 14px 16px;
      }

      .menu {
        display: flex;
        gap: 6px;
        margin-top: 10px;
        overflow-x: auto;
      }

      .menu a {
        white-space: nowrap;
      }

      main {
        padding: 16px;
      }

      .filters {
        grid-template-columns: 1fr 1fr;
      }

      .filters input[type="search"] {
        grid-column: 1 / -1;
      }
    }
  </style>
</head>

<body>

  <!-- Kumpulan ikon menu -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
    <symbol id="i-receipt" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></symbol>
    <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.5 3-6 6.5-6s6.5 2.5 6.5 6"/><path d="M16 5a3.5 3.5 0 010 6.5M18 14.5c2 .8 3.5 2.6 3.5 5.5"/></symbol>
    <symbol id="i-user-plus" viewBox="0 0 24 24"><circle cx="10" cy="8" r="3.5"/><path d="M3 20c0-3.5 3-6 7-6s7 2.5 7 6"/><path d="M19 8v6M16 11h6"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.5 3.1-6 7-6s7 2.5 7 6"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 4v16h16"/><path d="M8 16v-5M12 16V8M16 16v-3"/></symbol>
    <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 4H5a2 2 0 00-2 2v12a2 2 0 002 2h4"/><path d="M16 8l4 4-4 4M20 12H9"/></symbol>
  </svg>

  <div class="app">

    <!-- Sidebar -->
    <aside class="sidebar">
      <h1>Joy Salon</h1>
      <small>Admin</small>

      <nav class="menu">
        <a href="#"><svg><use href="#i-home"/></svg><span>Beranda</span></a>
        <a href="#" class="active" aria-current="page"><svg><use href="#i-calendar"/></svg><span>Reservasi</span></a>
        <a href="#"><svg><use href="#i-receipt"/></svg><span>Transaksi</span></a>
        <a href="#"><svg><use href="#i-sparkle"/></svg><span>Treatment</span></a>
        <a href="#"><svg><use href="#i-users"/></svg><span>Pelanggan</span></a>
        <a href="#"><svg><use href="#i-user-plus"/></svg><span>Karyawan</span></a>
        <a href="#"><svg><use href="#i-user"/></svg><span>Pengguna</span></a>
        <a href="#"><svg><use href="#i-chart"/></svg><span>Laporan</span></a>
        <a href="#"><svg><use href="#i-logout"/></svg><span>Keluar</span></a>
      </nav>
    </aside>

    <!-- Konten utama -->
    <main>
      <div class="page-head">
        <div>
          <h2>Reservasi</h2>
          <p id="subtitle"></p>
        </div>
        <button class="btn" id="btn-add">Tambah reservasi</button>
      </div>

      <div class="filters">
        <input id="search" type="search" placeholder="Cari nama pelanggan atau nomor HP..." aria-label="Cari">
        <input id="filter-date" type="date" value="2026-09-18" aria-label="Tanggal">
        <select id="filter-status" aria-label="Status">
          <option value="">Semua status</option>
          <option>Menunggu</option>
          <option>Dikonfirmasi</option>
          <option>Selesai</option>
          <option>Ditolak</option>
        </select>
      </div>

      <div class="card">
        <table>
          <thead>
            <tr>
              <th>Kode</th>
              <th>Pelanggan</th>
              <th>Treatment</th>
              <th>Jam</th>
              <th>Karyawan</th>
              <th>Status</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- Dialog tambah / ubah / lihat -->
  <dialog id="dialog">
    <h3 id="dialog-title"></h3>

    <form id="form" method="dialog">
      <label>Nama pelanggan
        <input id="f-name" required>
      </label>

      <label>Nomor HP
        <input id="f-phone" inputmode="tel" placeholder="08xxxxxxxxxx">
      </label>

      <label>Treatment
        <input id="f-treatment" required>
      </label>

      <div class="row">
        <label>Tanggal
          <input id="f-date" type="date" required>
        </label>
        <label>Jam
          <input id="f-time" type="time" required>
        </label>
      </div>

      <div class="row">
        <label>Karyawan
          <select id="f-staff">
            <option value="">—</option>
            <option>Rina</option>
            <option>Bagas</option>
            <option>Tika</option>
          </select>
        </label>
        <label>Status
          <select id="f-status">
            <option>Menunggu</option>
            <option>Dikonfirmasi</option>
            <option>Selesai</option>
            <option>Ditolak</option>
          </select>
        </label>
      </div>

      <div class="dialog-foot">
        <button type="button" class="btn btn-danger" id="btn-delete">Hapus</button>
        <button type="button" class="btn btn-ghost" id="btn-close">Tutup</button>
        <button class="btn" id="btn-save">Simpan</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status"></div>

  <script>
    /* ========== Data awal ========== */
    const STORAGE_KEY = "joysalon-reservasi";

    const SEED_DATA = [
      { id: "RS-1043", name: "gita", phone: "081234560043", treatment: "Smoothing",          date: "2026-09-18", time: "15:00", staff: "Rina",  status: "Menunggu" },
      { id: "RS-1042", name: "melisa",  phone: "081234560042", treatment: "Potong pria",        date: "2026-09-18", time: "13:00", staff: "Bagas", status: "Dikonfirmasi" },
      { id: "RS-1041", name: "Jesi",  phone: "081234560041", treatment: "Creambath + potong", date: "2026-09-18", time: "11:30", staff: "Tika",  status: "Selesai" },
      { id: "RS-1040", name: "Nadia",    phone: "081234560040", treatment: "Hair spa",           date: "2026-09-18", time: "10:00", staff: "Rina",  status: "Selesai" },
      { id: "RS-1039", name: "dean",   phone: "081234560039", treatment: "Facial dasar",       date: "2026-09-18", time: "16:30", staff: "",      status: "Ditolak" },
      { id: "RS-1038", name: "dafa",    phone: "081234560038", treatment: "Manicure",           date: "2026-09-19", time: "09:30", staff: "Tika",  status: "Menunggu" }
    ];

    /* ========== State ========== */
    let reservations = loadData();
    let formMode = "";      // "tambah" | "ubah" | "lihat"
    let editingId = null;

    /* ========== Helper ========== */
    const $ = (id) => document.getElementById(id);

    const ESCAPE_MAP = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
    const escapeHtml = (text) => String(text).replace(/[&<>"']/g, (c) => ESCAPE_MAP[c]);

    const formatTime = (time) => time.replace(":", ".");
    const digitsOnly = (text) => text.replace(/\D/g, "");

    function showToast(message) {
      const toast = $("toast");
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove("show"), 2000);
    }

    /* ========== Penyimpanan (localStorage) ========== */
    function loadData() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) return JSON.parse(saved);
      } catch (e) { /* abaikan, pakai data awal */ }
      return SEED_DATA.map((item) => ({ ...item }));
    }

    function saveData() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(reservations));
      } catch (e) { /* abaikan jika penyimpanan tidak tersedia */ }
    }

    /* ========== Tampilan tabel ========== */
    function actionButtons(item) {
      const button = (action, label) =>
        `<button data-action="${action}" data-id="${item.id}">${label}</button>`;
      const sep = '<span class="sep">·</span>';

      switch (item.status) {
        case "Menunggu":     return button("konfirmasi", "Konfirmasi") + sep + button("tolak", "Tolak");
        case "Dikonfirmasi": return button("ubah", "Ubah") + sep + button("selesai", "Selesai");
        default:             return button("lihat", "Lihat");
      }
    }

    function getFilteredData() {
      const keyword = $("search").value.trim().toLowerCase();
      const keywordDigits = digitsOnly(keyword);
      const date = $("filter-date").value;
      const status = $("filter-status").value;

      return reservations
        .filter((item) => {
          const matchDate = !date || item.date === date;
          const matchStatus = !status || item.status === status;
          const matchKeyword =
            !keyword ||
            item.name.toLowerCase().includes(keyword) ||
            (keywordDigits && digitsOnly(item.phone).includes(keywordDigits));
          return matchDate && matchStatus && matchKeyword;
        })
        .sort((a, b) => b.id.localeCompare(a.id));
    }

    function render() {
      const rows = getFilteredData();
      const date = $("filter-date").value;

      $("table-body").innerHTML = rows.length
        ? rows.map((item) => `
            <tr>
              <td>${item.id}</td>
              <td>${escapeHtml(item.name)}</td>
              <td>${escapeHtml(item.treatment)}</td>
              <td>${formatTime(item.time)}</td>
              <td>${item.staff ? escapeHtml(item.staff) : "—"}</td>
              <td><span class="pill status-${item.status}">${item.status}</span></td>
              <td class="actions">${actionButtons(item)}</td>
            </tr>`).join("")
        : `<tr><td colspan="7" class="empty">Tidak ada reservasi yang cocok. Ubah pencarian atau filter, atau tambah reservasi baru.</td></tr>`;

      const dateLabel = date
        ? new Date(date + "T00:00:00").toLocaleDateString("id-ID", { weekday: "long", day: "numeric", month: "long", year: "numeric" })
        : "Semua tanggal";
      $("subtitle").textContent = `${dateLabel} · ${rows.length} jadwal`;
    }

    /* ========== Aksi CRUD ========== */
    function changeStatus(id, status, message) {
      reservations.find((item) => item.id === id).status = status;
      saveData();
      render();
      showToast(message);
    }

    function openForm(mode, item) {
      formMode = mode;
      editingId = item ? item.id : null;

      const titles = {
        tambah: "Tambah reservasi",
        ubah: `Ubah ${editingId}`,
        lihat: `Detail ${editingId}`
      };
      $("dialog-title").textContent = titles[mode];

      const values = item || {
        name: "", phone: "", treatment: "",
        date: $("filter-date").value || "2026-09-18",
        time: "", staff: "", status: "Menunggu"
      };

      $("f-name").value = values.name;
      $("f-phone").value = values.phone;
      $("f-treatment").value = values.treatment;
      $("f-date").value = values.date;
      $("f-time").value = values.time;
      $("f-staff").value = values.staff;
      $("f-status").value = values.status;

      const readOnly = mode === "lihat";
      ["f-name", "f-phone", "f-treatment", "f-date", "f-time", "f-staff", "f-status"]
        .forEach((id) => { $(id).disabled = readOnly; });

      $("btn-save").style.display = readOnly ? "none" : "";
      $("btn-delete").style.display = mode === "tambah" ? "none" : "";

      $("dialog").showModal();
    }

    function submitForm(event) {
      event.preventDefault();

      const values = {
        name: $("f-name").value.trim(),
        phone: $("f-phone").value.trim(),
        treatment: $("f-treatment").value.trim(),
        date: $("f-date").value,
        time: $("f-time").value,
        staff: $("f-staff").value,
        status: $("f-status").value
      };

      if (formMode === "tambah") {
        const lastNumber = Math.max(1000, ...reservations.map((item) => Number(item.id.slice(3))));
        reservations.push({ id: "RS-" + (lastNumber + 1), ...values });
        showToast("Reservasi ditambahkan");
      } else {
        Object.assign(reservations.find((item) => item.id === editingId), values);
        showToast("Perubahan disimpan");
      }

      saveData();
      $("dialog").close();
      render();
    }

    function deleteReservation() {
      if (!confirm(`Hapus reservasi ${editingId}?`)) return;

      reservations = reservations.filter((item) => item.id !== editingId);
      saveData();
      $("dialog").close();
      render();
      showToast("Reservasi dihapus");
    }

    function handleTableClick(event) {
      const button = event.target.closest("button");
      if (!button) return;

      const { action, id } = button.dataset;
      const item = reservations.find((r) => r.id === id);

      switch (action) {
        case "konfirmasi": changeStatus(id, "Dikonfirmasi", "Reservasi dikonfirmasi"); break;
        case "tolak":      changeStatus(id, "Ditolak", "Reservasi ditolak"); break;
        case "selesai":    changeStatus(id, "Selesai", "Reservasi selesai"); break;
        case "ubah":       openForm("ubah", item); break;
        case "lihat":      openForm("lihat", item); break;
      }
    }

    /* ========== Event listener ========== */
    $("btn-add").addEventListener("click", () => openForm("tambah"));
    $("btn-close").addEventListener("click", () => $("dialog").close());
    $("btn-delete").addEventListener("click", deleteReservation);
    $("form").addEventListener("submit", submitForm);
    $("table-body").addEventListener("click", handleTableClick);

    ["search", "filter-date", "filter-status"].forEach((id) =>
      $(id).addEventListener("input", render)
    );

    /* ========== Mulai ========== */
    render();
  </script>

</body>

</html>
